<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>isha's bookshelf</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="bookshelf">
  <div id="bar">
    <a href="/">← home</a>
    <a href="/scrapbook">scrapbook</a>
    <span class="spacer"></span>
    <span id="owner-add"></span>
    <span id="auth-control"></span>
  </div>

  <header id="masthead">
    <h1>my notes</h1>
    <p class="sub">links, learnings, and writeups for things i loved.</p>
  </header>

  <div id="controls">
    <nav id="tabs"></nav>
    <select id="sort" aria-label="sort">
      <option value="default">favorites first</option>
      <option value="love">♥ score</option>
      <option value="recent">recently added</option>
      <option value="title">title a–z</option>
      <option value="time">reading time</option>
    </select>
  </div>
  <p id="count"></p>

  <main id="shelf"></main>

  <script src="/bookshelf.js"></script>
</body>
</html>
