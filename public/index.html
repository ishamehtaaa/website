<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deploy Demo</title>
  <style>
    body {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      background: #0f0f0f;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      gap: 24px;
    }
    h1 { font-weight: 500; font-size: 18px; }
  </style>
</head>
<body>
  <h1>welcome to isha's house</h1>
  <p>currently under construction...see you soon <3</p>
  <p><span id="count">—</span> visitors</p>
  <script>
    fetch("/api/count")
      .then(r => r.json())
      .then(d => {
        document.getElementById("count").textContent = d.count.toLocaleString();
      })
      .catch(() => {
        document.getElementById("count").textContent = "?";
      });
  </script>
</body>

</html>
