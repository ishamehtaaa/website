<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>isha's house</title>
  <style>
    body {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      background: #0f0f0f;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      gap: 24px;
    }
    h1 { font-weight: 500; font-size: 18px; }
  </style>
</head>
<body>
  <h1>welcome to isha's house</h1>
  <p>currently under construction...see you soon <3</p>
  <p id="count">—</p>
  <script>
  const el = document.getElementById("count");
  const seen = localStorage.getItem("counted");
  fetch(seen ? "/api/count/peek" : "/api/count")
    .then(r => r.json())
    .then(d => {
      const n = d.count;
      el.textContent = `${n.toLocaleString()} ${n === 1 ? "visitor" : "visitors"}`;
      localStorage.setItem("counted", "1");
    })
    .catch(() => { el.textContent = "?"; });
</script>
<h2>guestbook</h2>

<div>
  <input id="gb-name" placeholder="your name" maxlength="50" />
  <textarea id="gb-message" placeholder="leave a note..." maxlength="500"></textarea>
  <button id="gb-submit">sign</button>
  <span id="gb-status"></span>
</div>

<ul id="gb-entries"></ul>

<script>
  const esc = s => s.replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function loadGuestbook() {
    fetch("/api/guestbook")
      .then(r => r.json())
      .then(rows => {
        document.getElementById("gb-entries").innerHTML = rows.map(r => `
          <li>
            <strong>${esc(r.name)}</strong>
            <span>${new Date(r.created_at + "Z").toLocaleDateString()}</span>
            <p>${esc(r.message)}</p>
          </li>
        `).join("");
      });
  }

  document.getElementById("gb-submit").addEventListener("click", () => {
    const name = document.getElementById("gb-name").value.trim();
    const message = document.getElementById("gb-message").value.trim();
    const status = document.getElementById("gb-status");
    if (!name || !message) { status.textContent = "fill in both fields"; return; }
    status.textContent = "signing...";
    fetch("/api/guestbook", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, message }),
    })
      .then(r => r.json())
      .then(d => {
        if (d.ok) {
          document.getElementById("gb-name").value = "";
          document.getElementById("gb-message").value = "";
          status.textContent = "";
          loadGuestbook();
        } else {
          status.textContent = d.error || "something went wrong";
        }
      })
      .catch(() => { status.textContent = "couldn't sign, try again"; });
  });

  loadGuestbook();
</script>
</body>
</html>
