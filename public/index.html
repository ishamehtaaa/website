<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0f0f" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#fbfbf9" media="(prefers-color-scheme: light)" />
  <title>isha's house</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="home">
  <nav id="nav">
    <a href="/scrapbook">scrapbook →</a>
    <a href="/bookshelf">bookshelf →</a>
  </nav>

  <main>
    <h1>welcome to isha's house</h1>
    <p>currently under construction...see you soon</p>
    <p id="count">—</p>
  </main>

  <aside id="guestbook">
    <h2>guestbook</h2>
    <div class="gb-form">
      <input id="gb-name" placeholder="your name" maxlength="50" />
      <textarea id="gb-message" placeholder="leave a note..." maxlength="500"></textarea>
      <button id="gb-submit">sign</button>
      <span id="gb-status"></span>
    </div>
    <ul id="gb-entries"></ul>
  </aside>

  <script src="/app.js"></script>
</body>
</html>
