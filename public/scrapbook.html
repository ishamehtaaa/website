<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0f0f" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#fbfbf9" media="(prefers-color-scheme: light)" />
  <title>isha's scrapbook</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="scrapbook">
  <div id="bar">
    <a href="/">← home</a>
    <a href="/bookshelf">bookshelf</a>
    <nav id="boards"></nav>
    <span id="add-controls">
      <button data-add="note">+ note</button>
      <button data-add="image">+ photo</button>
      <button data-add="link">+ link</button>
    </span>
    <span id="owner-controls"></span>
    <span id="auth-control"></span>
    <span id="hint">drag to move · click to select · double-click to remove</span>
  </div>

  <div id="board">
    <div id="empty">a little empty in here</div>
  </div>

  <div id="deadend" hidden>
    <div class="deadend-card">
      <p>404 — there's nothing here</p>
      <a href="/">← back home</a>
    </div>
  </div>

  <input type="file" id="file-input" accept="image/*" hidden />

  <dialog id="overlay">
    <form class="modal" id="modal" autocomplete="off"></form>
  </dialog>

  <script src="/vendor/interact.min.js"></script>
  <script src="/scrapbook.js"></script>
</body>
</html>
