<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>isha's scrapbook</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --fg: #e0e0e0;
      --muted: #888;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      background: var(--bg);
      color: var(--fg);
      margin: 0;
      overflow: hidden;
    }

    /* ---- toolbar ---- */
    #bar {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 10000;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }

    #bar a { color: var(--muted); text-decoration: none; margin-right: 6px; }
    #bar a:hover { color: var(--fg); }

    #bar button {
      font: inherit;
      font-size: 12px;
      border: 1px solid #333;
      background: #1b1b1b;
      color: var(--fg);
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
    }
    #bar button:hover { border-color: #f4c95d; color: #f4c95d; }

    #hint { color: var(--muted); font-size: 11px; margin-left: 4px; }

    /* ---- board ---- */
    #board {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .item {
      position: absolute;
      cursor: grab;
      user-select: none;
      touch-action: none;
      max-width: 280px;
    }
    .item.dragging { cursor: grabbing; }

    /* note */
    .item.note {
      background: #fdf8e4;
      color: #2b2b2b;
      padding: 12px 14px;
      width: 200px;
      border-radius: 3px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
      font-size: 13px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* photo — polaroid-ish frame */
    .item.image {
      background: #fafafa;
      padding: 8px 8px 10px;
      border-radius: 2px;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.5);
    }
    .item.image img {
      display: block;
      width: 220px;
      height: auto;
      border-radius: 1px;
    }
    .item.image .cap {
      color: #444;
      font-size: 11px;
      text-align: center;
      padding-top: 6px;
    }

    /* link card */
    .item.link {
      background: #16202b;
      border: 1px solid #2a3a4a;
      color: #cfe3f5;
      padding: 10px 12px;
      width: 180px;
      border-radius: 5px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
      font-size: 12px;
    }
    .item.link a { color: #8fc7ff; text-decoration: none; word-break: break-all; }
    .item.link a:hover { text-decoration: underline; }
    .item.link .cap { color: #cfe3f5; margin-bottom: 4px; font-weight: 600; }

    #empty {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      pointer-events: none;
    }

    /* ---- modal ---- */
    #overlay {
      position: fixed;
      inset: 0;
      z-index: 20000;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
    }
    #overlay.open { display: flex; }

    .modal {
      width: min(380px, calc(100vw - 32px));
      background: #161616;
      border: 1px solid #2c2c2c;
      border-radius: 10px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      padding: 18px;
      animation: pop 0.12s ease-out;
    }
    @keyframes pop {
      from { opacity: 0; transform: translateY(6px) scale(0.98); }
      to   { opacity: 1; transform: none; }
    }

    .modal h2 {
      margin: 0 0 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--fg);
      letter-spacing: 0.02em;
    }

    .modal label {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin: 0 0 5px;
    }
    .modal .field + .field { margin-top: 12px; }

    .modal input,
    .modal textarea {
      width: 100%;
      font: inherit;
      font-size: 13px;
      color: var(--fg);
      background: #0f0f0f;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 9px 10px;
      resize: none;
    }
    .modal input:focus,
    .modal textarea:focus {
      outline: none;
      border-color: #f4c95d;
    }
    .modal textarea { min-height: 88px; line-height: 1.45; }

    .modal .actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 18px;
    }
    .modal .actions button {
      font: inherit;
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid #333;
    }
    .modal .btn-cancel {
      background: transparent;
      color: var(--muted);
    }
    .modal .btn-cancel:hover { color: var(--fg); border-color: #555; }
    .modal .btn-ok {
      background: #f4c95d;
      color: #1a1a1a;
      border-color: #f4c95d;
      font-weight: 600;
    }
    .modal .btn-ok:hover { background: #ffd574; }
  </style>
</head>
<body>
  <div id="bar">
    <a href="/">← home</a>
    <button data-add="note">+ note</button>
    <button data-add="image">+ photo</button>
    <button data-add="link">+ link</button>
    <span id="hint">drag to move · double-click to remove</span>
  </div>

  <div id="board">
    <div id="empty">a little empty in here</div>
  </div>

  <input type="file" id="file-input" accept="image/*" hidden />

  <div id="overlay">
    <form class="modal" id="modal" autocomplete="off"></form>
  </div>

  <script src="/scrapbook.js"></script>
</body>
</html>
