# PRODUCTION (ishamehta.ca server) — app behind Caddy with TLS.
# The app port is NOT published; only Caddy is public on 80/443.
#   docker compose up -d --build
services:
  app:
    build: .
    container_name: app
    restart: unless-stopped
    environment:
      - DB_PATH=/data/site.db
      - SITE_PASSWORD=${SITE_PASSWORD}   # shared scrapbook password; set on the host (e.g. .env)
    volumes:
      - app_data:/data
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      # `default` keeps Caddy able to reach the website `app` (app:3000);
      # `caddy_net` lets it also reach the wiki-rewrite container (wiki-app:2000).
      - default
      - caddy_net
volumes:
  caddy_data:
    name: caddy_data
  caddy_config:
    name: caddy_config
  app_data:
    name: data
networks:
  caddy_net:
    external: true
